name: "Nix CI"
on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: "write"
  contents: "read"

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Check formatting
        run: nix fmt -- --ci

  evaluation:
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/flakehub-cache-action@main

      - name: Evaluate all Flake hosts & checks
        run: nix flake check --show-trace

  check-devshell:
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Check DevShell
        run: nix flake check ./os/nix/dev

  tofu-check:
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.0
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infrastructure/
      - name: Validate OpenTofu 01-core-network layer
        run: |
          cd infrastructure/01-core-network
          tofu init -backend=false
          tofu validate
