name: "Nix CI"
on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: "write"
  contents: "read"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      tofu: ${{ steps.filter.outputs.tofu }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'os/**'
              - '.github/workflows/ci.yml'
            tofu:
              - 'infrastructure/**'
              - '.github/workflows/ci.yml'

  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Check formatting
        run: nix fmt -- --ci

  evaluation:
    needs: [linting, changes]
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Evaluate all Flake hosts & checks
        run: nix flake check --show-trace

  check-devshell:
    needs: [linting, changes]
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Check DevShell
        run: nix flake check ./os/nix/dev

  tofu-check:
    needs: [linting, changes]
    if: ${{ needs.changes.outputs.tofu == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.0
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infrastructure/
      - name: Validate OpenTofu 01-core-network layer
        run: |
          cd infrastructure/01-core-network
          tofu init -backend=false
          tofu validate

  ci-success:
    needs: [linting, evaluation, check-devshell, tofu-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
