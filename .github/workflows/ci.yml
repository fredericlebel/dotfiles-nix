name: "Nix CI"
on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: "write"
  contents: "read"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
      tofu: ${{ steps.filter.outputs.tofu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'os/**'
              - '.github/workflows/ci.yml'
            tofu:
              - 'infrastructure/**'
              - '.github/workflows/ci.yml'

  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
      - name: Check formatting
        run: nix fmt -- --ci

  evaluation:
    needs: [linting, changes]
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        with:
          use-flakehub: false
      - name: Evaluate all Flake hosts & checks
        run: nix flake check --show-trace

  check-devshell:
    needs: [linting, changes]
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14 # v14
      - name: Check DevShell
        run: nix flake check ./os/nix/dev

  tofu-check:
    needs: [linting, changes]
    if: ${{ needs.changes.outputs.tofu == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.0
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infrastructure/
      - name: Validate OpenTofu 01-core-network layer
        run: |
          cd infrastructure/01-core-network
          tofu init -backend=false
          tofu validate

  ci-success:
    needs: [linting, evaluation, check-devshell, tofu-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
