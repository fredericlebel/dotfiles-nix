name: "Nix CI"
on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: "write"
  contents: "read"

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Check formatting
        run: nix fmt -- --ci

  evaluation:
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - uses: DeterminateSystems/magic-nix-cache-action@v8
        with:
          use-flakehub: false

      - name: Evaluate all NixOS hosts
        run: |
          for host in $(nix eval --json .#nixosConfigurations --apply "builtins.attrNames" | jq -r '.[]'); do
            echo "Evaluating NixOS host: $host"
            nix eval .#nixosConfigurations."$host".config.system.build.toplevel.drvPath
          done

      - name: Evaluate all Darwin hosts
        run: |
          for host in $(nix eval --json .#darwinConfigurations --apply "builtins.attrNames" | jq -r '.[]'); do
            echo "Evaluating Darwin host: $host"
            nix eval .#darwinConfigurations."$host".system.drvPath
          done

      - name: Dry-run Build all NixOS hosts
        run: |
          for host in $(nix eval --json .#nixosConfigurations --apply "builtins.attrNames" | jq -r '.[]'); do
            echo "Dry-run building NixOS host: $host"
            nix build .#nixosConfigurations."$host".config.system.build.toplevel --dry-run
          done

  check-devshell:
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Check DevShell
        run: nix flake check ./nix/dev

  tofu-check:
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.0
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infrastructure/
      - name: Validate OpenTofu 01-core-network layer
        run: |
          cd infrastructure/01-core-network
          tofu init -backend=false
          tofu validate
